name: Release

on:
  push:
    branches: [main, next]
  workflow_dispatch: {}

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC); provenance comes with it
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0} # semantic-release needs full history
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        # Node 24's npm 11: the plugin runs whatever `npm` is on PATH, and npm 10 can't publish via OIDC.
        with: {node-version: '24', cache: 'pnpm'}
      - run: pnpm install --frozen-lockfile
      # A red build or suite publishes nothing.
      - run: pnpm build
      - run: pnpm test
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }} # a PAT only once main is branch-protected
          # No NPM_TOKEN: npm trusts this workflow (release.yaml) as @arkitektio/bsx's publisher.
        run: pnpm exec semantic-release
